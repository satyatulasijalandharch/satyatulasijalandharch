name: Deploy

on:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24.21.0
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Astro check
              run: npm run check

            - name: Build Astro project
              run: npm run build

            - name: Deploy Preview to Cloudflare
              if: github.event_name == 'pull_request'
              id: preview
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: 'preview --name pr-${{ github.event.pull_request.number }} --message "${{ github.event.head_commit.message || github.event.pull_request.title || github.event.pull_request.body }}"'

            - name: Comment Preview Details on PR
              if: github.event_name == 'pull_request' && (success() || failure())
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const prNumber = context.issue.number;
                      const sha = context.sha.substring(0, 7);
                      const commitMsg = context.payload.pull_request?.title || 'Commit ' + sha;
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const previewUrl = '${{ steps.preview.outputs.deployment-url || steps.preview.outputs.preview-url }}' || `https://pr-${prNumber}.stjch.in`;
                      const isSuccess = '${{ job.status }}' === 'success';

                      const statusEmoji = isSuccess ? '✅' : '❌';
                      const statusText = isSuccess ? 'Ready' : 'Failed';

                      const body = [
                        `### ${statusEmoji} Cloudflare Preview Deployment: **${statusText}**`,
                        '',
                        '| Item | Details |',
                        '| :--- | :--- |',
                        isSuccess ? `| 🌐 **Preview URL** | [${previewUrl}](${previewUrl}) |` : '| 🌐 **Preview URL** | *Deployment Failed* |',
                        `| 📝 **Commit** | \`${sha}\` — ${commitMsg} |`,
                        `| 🔍 **Action Logs** | [View workflow run logs](${runUrl}) |`,
                        '',
                        '> _Built with Cloudflare Workers & GitHub Actions_'
                      ].join('\n');

                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                        body: body,
                      });

            - name: Deploy Production to Cloudflare
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: 'deploy'
